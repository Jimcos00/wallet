<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2f33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="jszip.min.js"></script>
<style>
:root{
  --glass:rgba(38,56,58,.24); --glass-hi:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.22); --line-soft:rgba(255,255,255,.12);
  --text:#fbfaf7; --muted:rgba(251,250,247,.70); --faint:rgba(251,250,247,.46);
  --accent:#4fd1a5; --accent-2:#9ff0d3; --accent-ink:#0b3328; --danger:#ff8a7a;
  --pos:#bff7e1; --neg:#ffd0c8; --neg-2:#e97a66; --acc-rgb:79,209,165;
  --bg-grad:linear-gradient(135deg,#a8987c 0%,#7f9488 32%,#45706f 62%,#1c2d32 100%); --body:#1e3035;
  --blob1:#d9be93; --blob2:#2fae92; --blob3:#0f1f24; --sheet:rgba(44,66,68,.78);
  --hl:linear-gradient(150deg,rgba(94,224,180,.92),rgba(28,140,116,.85)); --hl-ink:#06281f;
  --orb:radial-gradient(circle at 32% 28%,#fff 0,#d7fff0 9%,#7fe6c2 28%,#2aa585 58%,#145a4c 85%); --orb-glow:rgba(20,90,76,.7);
  --logo:radial-gradient(circle at 30% 25%,#d6fff0,#4fd1a5 45%,#1f8f78);
  --ascii:linear-gradient(160deg,#9ff0d3,#4fd1a5 40%,#d9be93);
  --ci1:#9ff0d3; --ci2:#2fae88; --ce1:#ffd2c9; --ce2:#e97a66; --pt:235,255,245; --pl:190,255,225;
  --ink:#16201f; --r:26px; --r-sm:16px;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.45,.5,1);
  --shadow:0 30px 60px -30px rgba(5,14,16,.6);
}
:root[data-theme="amethyst"]{
  --glass:rgba(42,30,77,.30); --accent:#8b7cc7; --accent-2:#c9c2e3; --accent-ink:#0e0b1d;
  --pos:#d6cff5; --neg:#ffb8cf; --neg-2:#d9779b; --acc-rgb:139,124,199;
  --bg-grad:linear-gradient(140deg,#8b7cc7 0%,#5a3b8c 28%,#2a1e4d 58%,#0e0b1d 100%); --body:#0e0b1d;
  --blob1:#c9c2e3; --blob2:#5a3b8c; --blob3:#0e0b1d; --sheet:rgba(42,30,77,.86);
  --hl:linear-gradient(150deg,rgba(201,194,227,.95),rgba(139,124,199,.9)); --hl-ink:#1a1233;
  --orb:radial-gradient(circle at 32% 28%,#fff 0,#ece8f8 9%,#c9c2e3 26%,#8b7cc7 52%,#2a1e4d 88%); --orb-glow:rgba(42,30,77,.8);
  --logo:radial-gradient(circle at 30% 25%,#f1edff,#8b7cc7 45%,#5a3b8c);
  --ascii:linear-gradient(160deg,#c9c2e3,#8b7cc7 45%,#5a3b8c);
  --ci1:#e4dff6; --ci2:#8b7cc7; --ce1:#ffd0de; --ce2:#c25b85; --pt:236,230,255; --pl:201,194,227;
  --shadow:0 30px 60px -30px rgba(5,3,14,.75);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);background:var(--body);transition:background .6s;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-user-select:none;user-select:none}
::selection{background:rgba(var(--acc-rgb),.35)}

/* ---------- background ---------- */
.backdrop{position:fixed;inset:0;z-index:-2;overflow:hidden;
  background:var(--bg-grad)}
.backdrop i{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform}
.backdrop i:nth-child(1){width:48vw;height:48vw;left:-10vw;top:-12vw;background:var(--blob1);opacity:.5;animation:drift1 26s ease-in-out infinite alternate}
.backdrop i:nth-child(2){width:42vw;height:42vw;right:-12vw;top:8vh;background:var(--blob2);opacity:.42;animation:drift2 32s ease-in-out infinite alternate}
.backdrop i:nth-child(3){width:55vw;height:55vw;left:20vw;bottom:-30vw;background:var(--blob3);opacity:.85;animation:drift3 38s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(8vw,6vh) scale(1.1)}}
@keyframes drift2{to{transform:translate(-10vw,14vh) scale(.92)}}
@keyframes drift3{to{transform:translate(-8vw,-6vh) scale(1.08)}}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none}

/* ---------- liquid glass ---------- */
.glass{position:relative;border-radius:var(--r);
  background:radial-gradient(520px circle at var(--mx,30%) var(--my,-20%),rgba(255,255,255,.10),transparent 45%),var(--glass);
  border:1px solid rgba(255,255,255,.06);
  backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 0 40px rgba(255,255,255,.035)}
.glass::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(145deg,rgba(255,255,255,.7),rgba(255,255,255,.1) 30%,rgba(255,255,255,.04) 60%,rgba(255,255,255,.4));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.tilt{transition:transform .5s var(--ease),box-shadow .5s var(--ease);transform-style:preserve-3d;will-change:transform}
.tilt:hover{box-shadow:0 40px 70px -30px rgba(5,14,16,.7),inset 0 1px 0 rgba(255,255,255,.32),inset 0 0 40px rgba(255,255,255,.05)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px 1fr;gap:22px;padding:22px;min-height:100vh;max-width:1560px;margin:0 auto}
.side{position:sticky;top:22px;height:calc(100vh - 44px);display:flex;flex-direction:column;padding:18px 14px}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid var(--line-soft);margin-bottom:10px}
.brand b{display:block;font-size:15px}.brand small{color:var(--muted);font-size:12px}
.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:800;color:var(--accent-ink);
  background:var(--logo);box-shadow:inset 0 -4px 8px rgba(0,0,0,.2),inset 0 2px 3px rgba(255,255,255,.6),0 8px 18px -6px rgba(31,143,120,.8)}
.navlabel{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:16px 12px 6px;font-weight:700}
.nav{position:relative}
.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:none;background:none;border-radius:13px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;text-align:left;transition:color .3s,background .3s}
.nav button:hover{color:var(--text);background:rgba(255,255,255,.06)}
.nav button.on{color:var(--text);background:rgba(255,255,255,.17);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 16px -8px rgba(0,0,0,.4)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-size:11px;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.14);color:var(--muted)}
.side .foot{margin-top:auto;padding:14px;border-radius:18px;background:rgba(0,0,0,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.side .foot .v{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.side .foot small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.syncline{display:flex;align-items:center;gap:7px;border:none;background:none;padding:0 0 8px;color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer}
.syncline:hover{color:var(--text)}
.syncdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:rgba(255,255,255,.35)}
.syncdot[data-state=ok]{background:#5be3a4;box-shadow:0 0 8px #5be3a4}
.syncdot[data-state=busy],.syncdot[data-state=idle]{background:#ffd27a;animation:pulse 1s ease-in-out infinite}
.syncdot[data-state=err]{background:#ff7a7a;box-shadow:0 0 8px #ff7a7a}
.syncdot.abs{position:absolute;right:6px;top:6px}
@keyframes pulse{50%{opacity:.35}}
.side .foot .themes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.side .foot .themes button{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:12px;border:1px solid var(--line-soft);background:rgba(255,255,255,.06);cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);transition:.25s}
.side .foot .themes button.on{background:rgba(255,255,255,.18);color:var(--text);border-color:var(--line)}
.side .foot .themes i{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 3px rgba(0,0,0,.25),inset 0 1px 2px rgba(255,255,255,.5)}
.side .foot .two-btn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.side .foot .two-btn .btn{padding:8px 6px;font-size:12.5px;min-width:0;gap:6px}
main{min-width:0;padding-bottom:40px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:4px 4px 22px;flex-wrap:wrap}
.top h1{font-size:clamp(26px,3.2vw,38px);margin:0;letter-spacing:-.025em;font-weight:800}
.top p{margin:6px 0 0;color:var(--muted);font-size:14px}
.top .row{flex-wrap:wrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.12);cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);transition:transform .25s var(--spring),background .25s,box-shadow .25s}
.btn:hover{background:rgba(255,255,255,.22)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(180deg,#fff,#ece8df);color:var(--ink);border-color:transparent;box-shadow:0 10px 24px -10px rgba(0,0,0,.5),inset 0 -2px 0 rgba(0,0,0,.06)}
.btn.primary:hover{background:#fff;transform:translateY(-1px)}
.btn.accent{background:linear-gradient(180deg,#6ee0b8,#3cbf93);color:var(--accent-ink);border-color:transparent;box-shadow:0 10px 24px -10px rgba(31,143,120,.9),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.ghost{background:none;box-shadow:none}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn svg{width:16px;height:16px;flex:none}
.iconbtn{width:34px;height:34px;border-radius:11px;border:1px solid var(--line-soft);background:rgba(255,255,255,.08);display:grid;place-items:center;cursor:pointer;flex:none;transition:background .2s,transform .25s var(--spring)}
.iconbtn:hover{background:rgba(255,255,255,.2)}
.iconbtn:active{transform:scale(.9)}
.iconbtn svg{width:15px;height:15px}
.inp,select.inp{padding:11px 14px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.10);outline:none;min-width:0;transition:border-color .2s,background .2s,box-shadow .2s}
.inp:focus{border-color:rgba(255,255,255,.65);background:rgba(255,255,255,.16);box-shadow:0 0 0 4px rgba(var(--acc-rgb),.2)}
.inp::placeholder{color:var(--faint)}
select.inp option{color:#111}
textarea.inp{resize:vertical;line-height:1.5}
.seg{position:relative;display:inline-flex;padding:4px;border-radius:999px;background:rgba(0,0,0,.18);border:1px solid var(--line-soft)}
.seg button{position:relative;z-index:1;border:none;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted);transition:color .25s}
.seg button.on{color:var(--ink)}
.seg .pill{position:absolute;z-index:0;top:4px;bottom:4px;border-radius:999px;background:var(--text);box-shadow:0 4px 12px -4px rgba(0,0,0,.4);transition:left .4s var(--spring),width .4s var(--spring)}

/* ---------- bento ---------- */
.bento{display:grid;gap:18px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c-hero{grid-column:span 5;grid-row:span 2}
.c-stat{grid-column:span 2}
.c-ascii{grid-column:span 3;grid-row:span 2}
.c-chart{grid-column:span 7}
.c-budget{grid-column:span 5}
.c-recent{grid-column:span 5}
.c-up{grid-column:span 4}
.c-notes{grid-column:span 3}
.card{padding:22px;overflow:hidden}
.card h3{position:relative;margin:0 0 4px;font-size:13.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.big{font-size:clamp(34px,3.8vw,48px);font-weight:800;letter-spacing:-.035em;margin:6px 0 4px;font-variant-numeric:tabular-nums;line-height:1.05}
.mid{font-size:clamp(22px,2vw,27px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:10px 0 4px;line-height:1.1}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.chip.pos{background:rgba(var(--acc-rgb),.26);color:var(--pos)}
.chip.neg{background:rgba(255,138,122,.22);color:#ffd9d3}
.stat{padding:18px;display:flex;flex-direction:column}
.stat small{font-size:12.5px;font-weight:600}
.stat .mid{margin-top:auto}
.stat.hl{background:radial-gradient(400px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.25),transparent 50%),var(--hl);color:var(--hl-ink)}
.stat.hl .muted,.stat.hl .faint{color:var(--hl-ink);opacity:.72}
.hero{display:flex;flex-direction:column}
.hero > *{position:relative;z-index:1}
.orb{position:absolute!important;z-index:0!important;right:-54px;top:18px;width:170px;height:170px;border-radius:50%;pointer-events:none;
  background:var(--orb);
  box-shadow:inset -18px -26px 50px rgba(0,30,25,.45),inset 10px 10px 30px rgba(255,255,255,.35),0 40px 70px -20px var(--orb-glow);
  animation:float 9s ease-in-out infinite;opacity:.85}
.orb.s2{right:auto;left:auto;top:auto;bottom:-70px;right:120px;width:90px;height:90px;opacity:.5;animation-duration:12s;animation-delay:-4s;
  background:radial-gradient(circle at 32% 28%,#fff 0,#f6e7cc 15%,#cfae7a 50%,#7a5d34 90%)}
@keyframes float{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-10px,14px) rotate(8deg)}}
.acc-mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:auto;padding-top:18px}
.acc-mini > div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.10);border:1px solid var(--line-soft);min-width:0;transition:background .25s,transform .3s var(--spring);cursor:pointer}
.acc-mini > div:hover{background:rgba(255,255,255,.17);transform:translateY(-2px)}
.acc-mini small{display:block;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-mini b{display:block;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.acc-mini .tx{min-width:0}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* brand badges (soft 3d) */
.bi{--s:40px;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.32);flex:none;display:grid;place-items:center;background:var(--bg);color:var(--fg);
  font-weight:800;font-size:calc(var(--s)*.46);line-height:1;letter-spacing:-.04em;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.22),0 6px 14px -6px rgba(0,0,0,.55)}
.bi svg{width:58%;height:58%}
.bi.sm{--s:30px}.bi.lg{--s:52px}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 6px;border-top:1px solid var(--line-soft);border-radius:12px;transition:background .2s}
.li:hover{background:rgba(255,255,255,.05)}
.li:first-child{border-top-color:transparent}
.li.c{grid-template-columns:40px minmax(0,1fr) auto}
.li .t b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t{min-width:0}
.emo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.13);font-size:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.neg{color:var(--neg)}.amt.pos{color:var(--pos)}
.li .acts{display:flex;gap:6px;opacity:0;transition:opacity .2s}
.li:hover .acts,.li:focus-within .acts{opacity:1}
.dayhead{display:flex;justify-content:space-between;padding:16px 6px 6px;font-size:12px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.dayhead:first-child{padding-top:2px}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}

/* accounts page */
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.acc{padding:22px;min-height:190px;display:flex;flex-direction:column;overflow:hidden}
.acc .glow{position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:var(--c);opacity:.32;filter:blur(26px);pointer-events:none}
.acc .ty{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-top:14px}
.acc .nm{font-size:19px;font-weight:800;margin-top:2px}
.acc .bal{margin-top:auto;padding-top:16px;font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.acc .acts{position:absolute;right:16px;top:16px;display:flex;gap:6px;z-index:2}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chartwrap{position:relative}
.chartwrap .nodata{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:13px;font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.cat{display:grid;grid-template-columns:minmax(0,120px) 1fr auto;gap:12px;align-items:center;font-size:13px;margin:10px 0}
.cat span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.cat b{text-align:right;font-variant-numeric:tabular-nums}
.meter{height:12px;border-radius:99px;background:rgba(0,0,0,.18);overflow:hidden;margin:14px 0 10px;box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;box-shadow:0 0 16px rgba(var(--acc-rgb),.6)}

/* ascii tile */
.ascii{display:flex;flex-direction:column;background:radial-gradient(500px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.08),transparent 50%),rgba(10,22,24,.42)}
.ascii pre{position:absolute;inset:0;margin:0;padding:14px;font:500 11px/1.05 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.06em;color:transparent;white-space:pre;overflow:hidden;
  background:var(--ascii);-webkit-background-clip:text;background-clip:text;opacity:.55;pointer-events:none;
  -webkit-mask:linear-gradient(180deg,transparent 0,#000 30%,#000 70%,transparent);mask:linear-gradient(180deg,transparent 0,#000 30%,#000 70%,transparent)}
.ascii .over{position:relative;z-index:1;margin-top:auto;padding:14px 16px;border-radius:18px;background:rgba(20,34,36,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line-soft)}

/* notes */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.note{padding:20px;cursor:pointer;display:flex;flex-direction:column;min-height:210px}
.note .head{display:flex;align-items:center;gap:12px}
.note .head b{font-size:17px}
.note .net{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:14px 0 6px;font-variant-numeric:tabular-nums}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.1);margin:6px 0 12px}
.split i{display:block;height:100%}
.note .lines{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px;margin-top:auto}
.note .lines div{display:flex;justify-content:space-between;gap:10px}
.note .lines span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note.add{display:grid;place-items:center;text-align:center;color:var(--muted);border:1.5px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.04);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.note.add::before{display:none}
.note.add:hover{color:var(--text);background:rgba(255,255,255,.08)}
.ledger{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quick .inp{flex:1 1 220px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 6px}
.kpi{padding:14px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid var(--line-soft)}
.kpi small{color:var(--muted);font-size:12px;font-weight:600}
.kpi b{display:block;font-size:20px;margin-top:6px;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--faint);margin-top:8px}
.hint code{font-family:'JetBrains Mono',monospace;font-size:11.5px;background:rgba(255,255,255,.1);padding:1px 6px;border-radius:6px;color:var(--muted)}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line-soft);background:rgba(255,255,255,.08);cursor:pointer;font-size:18px;transition:transform .25s var(--spring)}
.emojis button.on{background:rgba(255,255,255,.3);border-color:#fff;transform:scale(1.08)}

/* projects */
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.proj{overflow:hidden;display:flex;flex-direction:column}
.thumb{height:176px;position:relative;overflow:hidden;background:rgba(0,0,0,.2);border-bottom:1px solid var(--line-soft);cursor:pointer;margin:8px 8px 0;border-radius:19px}
.thumb iframe{position:absolute;left:0;top:0;width:400%;height:400%;transform:scale(.25);transform-origin:0 0;border:0;pointer-events:none;background:#fff;transition:transform 1.2s var(--ease)}
.proj:hover .thumb iframe{transform:scale(.25) translateY(-12%)}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:800;color:rgba(255,255,255,.45)}
.proj .body{padding:14px 16px 16px}
.proj .body b{font-size:15px}
.proj .body small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.drop{border:1.5px dashed rgba(255,255,255,.4);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);cursor:pointer;margin-bottom:18px;transition:background .25s,transform .3s var(--spring),border-color .25s}
.drop:hover{background:rgba(255,255,255,.06)}
.drop.over{background:rgba(var(--acc-rgb),.16);color:var(--text);border-color:var(--accent);transform:scale(1.01)}
.drop b{color:var(--text)}

/* viewer */
.viewer{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;padding:14px;gap:12px;background:rgba(14,24,26,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility .35s}
.viewer.open{opacity:1;visibility:visible}
.vbar{display:flex;align-items:center;gap:10px;padding:10px 12px;flex-wrap:wrap}
.vbar .path{flex:1;min-width:120px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vstage{flex:1;display:flex;justify-content:center;align-items:stretch;min-height:0;overflow:auto}
.vstage iframe{border:0;background:#fff;border-radius:16px;width:100%;height:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);transition:width .5s var(--spring);transform:translateY(16px) scale(.98);opacity:0}
.viewer.open .vstage iframe{transform:none;opacity:1;transition:width .5s var(--spring),transform .5s var(--ease) .05s,opacity .4s .05s}
.vfiles{position:absolute;right:20px;top:84px;bottom:20px;width:300px;padding:14px;overflow:auto;font-size:12px;z-index:2;opacity:0;transform:translateX(20px);pointer-events:none;transition:.35s var(--ease)}
.vfiles.open{opacity:1;transform:none;pointer-events:auto}
.vfiles div{padding:5px 6px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vfiles div:hover{background:rgba(255,255,255,.14)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,16,18,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;transition:opacity .3s var(--ease),visibility .3s}
.modal.open{opacity:1;visibility:visible}
.sheet{width:100%;max-width:470px;max-height:calc(100vh - 32px);overflow:auto;padding:24px;background:var(--sheet);
  transform:translateY(24px) scale(.96);transition:transform .5s var(--spring)}
.modal.open .sheet{transform:none}
.sheet h2{margin:0 0 16px;font-size:20px;letter-spacing:-.01em}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field .inp{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amount-inp{font-size:30px;font-weight:800;padding:12px 16px;letter-spacing:-.02em}
.sheet .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 -3px 6px rgba(0,0,0,.2),inset 0 2px 3px rgba(255,255,255,.4);transition:transform .25s var(--spring)}
.colors button.on{border-color:#fff;transform:scale(1.12)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px) scale(.9);opacity:0;transition:transform .5s var(--spring),opacity .3s;z-index:80;padding:12px 20px;font-weight:700;font-size:14px;pointer-events:none;border-radius:999px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- agenda ---------- */
.c-today{grid-column:1/-1}
.today-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.tcard{position:relative;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--line-soft);cursor:pointer;transition:background .2s,transform .3s var(--spring);overflow:hidden}
.tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.tcard:hover{background:rgba(255,255,255,.13);transform:translateY(-2px)}
.tcard .tm{font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.tcard b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .t{min-width:0}
.tcard.done{opacity:.55}.tcard.done b{text-decoration:line-through}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;font-size:10.5px;font-weight:800;background:var(--c);color:#14101f;vertical-align:1px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--c,var(--accent));background:none;display:grid;place-items:center;cursor:pointer;flex:none;color:#14101f;transition:background .25s,transform .3s var(--spring)}
.chk svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:.3s var(--spring)}
.chk.on{background:var(--c,var(--accent))}.chk.on svg{opacity:1;transform:none}
.chk:active{transform:scale(.85)}
.agenda{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}
.cal-dow{font-size:11px;color:var(--faint);text-align:center;font-weight:800;padding:4px 0;text-transform:uppercase;letter-spacing:.06em}
.cal-day{aspect-ratio:1/1;border-radius:14px;border:1px solid transparent;background:rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-weight:700;font-size:14px;color:var(--text);transition:background .2s,transform .3s var(--spring);padding:0}
.cal-day:hover{background:rgba(255,255,255,.14)}
.cal-day:active{transform:scale(.92)}
.cal-day.out{opacity:.32}
.cal-day.today{border-color:var(--accent);color:var(--accent-2)}
.cal-day.sel{background:var(--text);color:var(--ink);box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
.cal-dots{display:flex;gap:3px;height:6px}
.cal-dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.allday{display:flex;flex-direction:column;gap:8px;margin:10px 0 6px}
.tl{position:relative;margin-top:10px}
.tl-hour{height:56px;border-top:1px dashed rgba(255,255,255,.1);position:relative;cursor:pointer;transition:background .2s}
.tl-hour:hover{background:rgba(255,255,255,.04)}
.tl-hour span{position:absolute;left:0;top:-9px;font-size:11px;color:var(--faint);font-weight:700;font-variant-numeric:tabular-nums;background:transparent}
.tl-ev{position:absolute;left:54px;right:0;top:0;bottom:0;pointer-events:none}
.ev{position:absolute;border-radius:12px;padding:6px 10px;background:color-mix(in srgb,var(--c) 30%,rgba(20,14,40,.35));border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-left:4px solid var(--c);pointer-events:auto;cursor:pointer;overflow:hidden;font-size:12px;color:var(--text);box-shadow:0 10px 24px -12px rgba(0,0,0,.6);transition:transform .3s var(--spring),filter .2s}
.ev:hover{transform:scale(1.015);filter:brightness(1.1)}
.ev b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{color:var(--muted);font-variant-numeric:tabular-nums}
.ev.done{opacity:.5}.ev.done b{text-decoration:line-through}
.now-line{position:absolute;left:46px;right:0;height:2px;background:#ff6b8b;box-shadow:0 0 10px #ff6b8b;z-index:2;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:#ff6b8b}
.ecolors{display:flex;gap:8px;flex-wrap:wrap}
.ecolors button{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 -3px 6px rgba(0,0,0,.2),inset 0 2px 3px rgba(255,255,255,.4);transition:transform .25s var(--spring)}
.ecolors button.on{border-color:#fff;transform:scale(1.15)}
.switch{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:12px}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.li .txtline{font-weight:600}
.li.done .t b{text-decoration:line-through;opacity:.55}

/* ---------- motion ---------- */
main.enter .rise{animation:rise .8s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
main.enter .chart .b{animation:grow 1s var(--ease) both;animation-delay:calc(250ms + var(--d,0) * 60ms)}
.chart .b{transform-box:fill-box;transform-origin:50% 100%}
@keyframes grow{from{transform:scaleY(0)}}
main.enter .track i,main.enter .meter i,main.enter .split i{animation:fillx 1.1s var(--ease) both;animation-delay:.35s}
@keyframes fillx{from{width:0}}
.li.new{animation:flash 1.4s var(--ease)}
@keyframes flash{0%{background:rgba(var(--acc-rgb),.3)}100%{background:transparent}}

/* ---------- mobile ---------- */
.tabbar,.fab{display:none}
@media (max-width:1200px){
  .bento{grid-template-columns:repeat(6,minmax(0,1fr))}
  .c-hero{grid-column:span 6;grid-row:auto}.c-stat{grid-column:span 3}
  .c-ascii{grid-column:span 6;grid-row:auto;min-height:200px}
  .agenda{grid-template-columns:1fr}
  .c-chart,.c-budget,.c-recent{grid-column:span 6}.c-up,.c-notes{grid-column:span 3}
  .ledger{grid-template-columns:1fr}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr;padding:14px 16px calc(100px + env(safe-area-inset-bottom));gap:0}
  .side{display:none}
  .bento{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .c-hero,.c-ascii,.c-chart,.c-budget,.c-recent,.c-up,.c-notes,.c-today{grid-column:1/-1}
  .today-list{grid-template-columns:1fr}
  .cal-day{border-radius:11px;font-size:13px}
  .c-stat{grid-column:span 1}
  .card{padding:18px}
  .top{margin-top:max(8px,env(safe-area-inset-top))}
  .hide-m{display:none!important}
  .tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;padding:6px;justify-content:space-between;border-radius:24px}
  .tabbar button{flex:0 0 auto;display:flex;align-items:center;gap:0;padding:11px 12px;border:none;background:none;color:var(--muted);font-size:13px;font-weight:700;border-radius:18px;cursor:pointer;transition:background .35s var(--ease),color .3s,gap .35s var(--ease)}
  .tabbar button span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .45s var(--ease)}
  .tabbar button.on{background:rgba(255,255,255,.2);color:var(--text);gap:7px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  .tabbar button.on span{max-width:120px}
  .tabbar svg{width:20px;height:20px;flex:none}
  .fab{display:grid;place-items:center;position:fixed;right:20px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:41;width:58px;height:58px;border-radius:50%;border:none;
    background:radial-gradient(circle at 30% 25%,#fff,#e6e1d6);color:var(--ink);box-shadow:0 16px 34px -10px rgba(0,0,0,.6),inset 0 -3px 6px rgba(0,0,0,.1);cursor:pointer;transition:transform .3s var(--spring)}
  .fab:active{transform:scale(.9)}
  .fab svg{width:24px;height:24px}
  .li{grid-template-columns:40px minmax(0,1fr) auto;padding:11px 2px}
  .li .acts{grid-column:2/-1;justify-content:flex-end;opacity:1;margin-top:-4px}
  .li.c .acts{display:none}
  .vfiles{left:14px;right:14px;width:auto}
  .modal{align-items:flex-end;padding:0}
  .sheet{max-width:none;border-radius:28px 28px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom));transform:translateY(100%)}
  .inp,select.inp{font-size:16px}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.kpi{padding:10px}.kpi b{font-size:15px}
  .orb{width:140px;height:140px}
}
@media (hover:none){.tilt{transform:none!important}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="backdrop"><i></i><i></i><i></i></div>
<canvas id="fx"></canvas>

<div class="app">
  <aside class="side glass">
    <div class="brand" data-act="rename" style="cursor:pointer" title="Αλλαγή ονόματος"><div class="logo" id="brandLogo">W</div><div><b id="brandName">Wallet</b><small>Personal wallet</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="sideFoot"></div>
  </aside>
  <main id="main"></main>
</div>

<nav class="tabbar glass" id="tabbar"></nav>
<button class="fab" id="fab" aria-label="Νέο έξοδο"></button>

<div class="modal" id="modal"><div class="sheet glass" id="sheet"></div></div>

<div class="viewer" id="viewer">
  <div class="vbar glass">
    <button class="iconbtn" id="vClose" title="Κλείσιμο"></button>
    <b id="vTitle"></b>
    <span class="path" id="vPath"></span>
    <div class="seg" id="vSizes">
      <button data-w="100%" class="on">Desktop</button><button data-w="820px">Tablet</button><button data-w="390px">Mobile</button>
    </div>
    <button class="iconbtn" id="vReload" title="Επαναφόρτωση"></button>
    <button class="iconbtn" id="vFilesBtn" title="Αρχεία"></button>
    <button class="iconbtn" id="vNewTab" title="Άνοιγμα σε νέα καρτέλα"></button>
  </div>
  <div class="vstage" id="vStage"><iframe id="vFrame"></iframe></div>
  <div class="vfiles glass" id="vFiles"></div>
</div>

<div class="toast glass" id="toast"></div>

<script>
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ============ icons ============ */
const I = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  wallet:'<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><circle cx="16" cy="14.5" r="1.2"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
  repeat:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
  note:'<path d="M5 3h10l4 4v14H5z"/><path d="M15 3v4h4"/><path d="M9 12h6M9 16h4"/>',
  folder:'<path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  reload:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  files:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
  ext:'<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  swap:'<path d="M7 4L3 8l4 4"/><path d="M3 8h14"/><path d="M17 20l4-4-4-4"/><path d="M21 16H7"/>',
  down:'<path d="M12 4v12M6 10l6 6 6-6M4 20h16"/>',
  up:'<path d="M12 20V8M6 14l6-6 6 6M4 4h16"/>',
  pause:'<path d="M9 5v14M15 5v14"/>',
  play:'<path d="M7 4l13 8-13 8z"/>',
  cash:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>',
  bank:'<path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>',
  card:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6 15h4"/>',
  piggy:'<path d="M5 11a7 6 0 0 1 12-3h2v3l2 1v3h-2a7 6 0 0 1-3 3v2h-3v-1.5H9V20H6v-3a6 6 0 0 1-1-6z"/><circle cx="15" cy="11" r=".8"/>',
  cloud:'<path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4.25 4.25 0 0 1-.5 8.5z"/>',
  cal:'<rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  next:'<path d="M9 6l6 6-6 6"/>',
  palette:'<path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.9 1.4-1.9-.4-1.1.3-2.1 1.5-2.1H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'
};
const svg = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

/* ============ brands (monogram badges in brand colours) ============ */
const BRANDS = [

const COLLS = ['accounts','tx','subs','notes','events'];
let snap = new Map();
const recJson = (r) => JSON.stringify(Object.assign({}, r, {_u:0}));
function buildSnap(){ snap = new Map(); for (const c of COLLS) for (const r of S[c]) snap.set(c+':'+r.id, recJson(r)); snap.set('settings', recJson(S.settings)); }
function stamp(){
  const now = Date.now(), seen = new Set(); S.deleted = S.deleted || {};
  for (const c of COLLS) for (const r of S[c]){ const k = c+':'+r.id; seen.add(k); const j = recJson(r); if (snap.get(k)!==j){ r._u = now; snap.set(k,j); } }
  for (const k of [...snap.keys()]) if (k!=='settings' && !seen.has(k)){ S.deleted[k] = now; snap.delete(k); }
  const sj = recJson(S.settings); if (snap.get('settings')!==sj){ S.settings._u = now; snap.set('settings', sj); }
}
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('Δεν αποθηκεύτηκε (storage)'); } }
function save(){ stamp(); persist(); Sync.schedule(); }
function mergeStates(a, b){
  const out = blank(); out.deleted = Object.assign({}, b.deleted||{});
  for (const [k,t] of Object.entries(a.deleted||{})) out.deleted[k] = Math.max(t, out.deleted[k]||0);
  for (const c of COLLS){
    const m = new Map();
    for (const r of (b[c]||[])) m.set(r.id, r);
    for (const r of (a[c]||[])){ const o = m.get(r.id); if (!o || (r._u||0) >= (o._u||0)) m.set(r.id, r); }
    out[c] = [...m.values()].filter(r => !(out.deleted[c+':'+r.id] >= (r._u||0)));
  }
  out.settings = ((a.settings||{})._u||0) >= ((b.settings||{})._u||0) ? Object.assign({}, b.settings, a.settings) : Object.assign({}, a.settings, b.settings);
  return out;
}

/* ============ sync: encrypted file in a private GitHub Gist ============ */
const Sync = (() => {
  const CFG_KEY = 'spyr.sync.v1', FILE = 'spyr-wallet.enc.json', DESC = 'Spyrlidis Wallet sync (encrypted)';
  let cfg = {}; try { cfg = JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch(e){}
  let state = cfg.gistId ? 'idle' : 'off', msg = '', timer = null, busy = false, again = false, keyCache = null;
  const saveCfg = () => { try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch(e){} };
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function deriveKey(pass, salt){
    const sk = b64(salt);
    if (keyCache && keyCache.sk===sk && keyCache.pass===pass) return keyCache.key;
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
    keyCache = {sk, pass, key}; return key;
  }
  async function encrypt(obj, pass){
    const salt = cfg.salt ? unb64(cfg.salt) : crypto.getRandomValues(new Uint8Array(16)); cfg.salt = b64(salt);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, await deriveKey(pass, salt), new TextEncoder().encode(JSON.stringify(obj)));
    return JSON.stringify({v:1, salt:cfg.salt, iv:b64(iv), ct:b64(ct)});
  }
  async function decrypt(str, pass){
    const d = JSON.parse(str); cfg.salt = d.salt;
    try { const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(d.iv)}, await deriveKey(pass, unb64(d.salt)), unb64(d.ct)); return JSON.parse(new TextDecoder().decode(pt)); }
    catch(e){ throw new Error('Λάθος κωδικός κρυπτογράφησης'); }
  }
  async function gh(path, opts={}, token=cfg.token){
    const r = await fetch('https://api.github.com'+path, Object.assign({}, opts, {cache:'no-store', headers:{Authorization:'Bearer '+token, Accept:'application/vnd.github+json', 'Content-Type':'application/json'}}));
    if (r.status===401) throw new Error('Το token δεν είναι έγκυρο ή έληξε');
    if (r.status===404) throw new Error('Δεν βρέθηκε το gist (έχει δικαίωμα gist το token;)');
    if (!r.ok) throw new Error('GitHub σφάλμα '+r.status);
    return r.json();
  }
  async function pull(){
    const g = await gh('/gists/'+cfg.gistId); const f = g.files[FILE]; if (!f) return null;
    let c = f.content; if (f.truncated) c = await (await fetch(f.raw_url, {cache:'no-store'})).text();
    return c ? decrypt(c, cfg.pass) : null;
  }
  async function push(){ await gh('/gists/'+cfg.gistId, {method:'PATCH', body:JSON.stringify({files:{[FILE]:{content: await encrypt(S, cfg.pass)}}})}); }
  function paint(){
    const label = {off:'Συγχρονισμός: ανενεργός', idle:'Συγχρονισμός', busy:'Συγχρονισμός…', ok:'Συγχρονίστηκε '+(cfg.last?new Date(cfg.last).toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'}):''), err:'Σφάλμα συγχρονισμού'}[state];
    document.querySelectorAll('[data-sync-label]').forEach(el => el.textContent = label);
    document.querySelectorAll('[data-sync-dot]').forEach(el => el.dataset.state = state);
  }
  async function run(){
    if (!cfg.gistId) return;
    if (busy){ again = true; return; }
    busy = true; state = 'busy'; paint();
    try {
      const remote = await pull();
      const before = JSON.stringify(S);
      if (remote){
        S = mergeStates(S, remote); buildSnap(); persist();
        const changed = JSON.stringify(S) !== before;
        if (changed){ applyTheme(); const a = document.activeElement; if (!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) && !document.getElementById('modal').classList.contains('open')) render(); else needRender = true; }
      }
      if (!remote || JSON.stringify(S) !== JSON.stringify(remote)) await push();
      cfg.last = Date.now(); saveCfg(); state = 'ok'; msg = '';
    } catch(e){ state = 'err'; msg = e.message; console.warn('sync', e); }
    busy = false; paint();
    if (again){ again = false; run(); }
  }
  let needRender = false;
  document.addEventListener('focusout', () => setTimeout(() => { if (needRender && !document.getElementById('modal').classList.contains('open')){ needRender = false; render(); } }, 300));
  return {
    get on(){ return !!cfg.gistId; }, get state(){ return state; }, get msg(){ return msg; }, get last(){ return cfg.last; },
    paint, run,
    schedule(){ if (!cfg.gistId) return; clearTimeout(timer); state = 'busy'; paint(); timer = setTimeout(run, 1500); },
    async connect(token, pass){
      token = token.trim(); if (!token || !pass) throw new Error('Συμπλήρωσε token και κωδικό');
      const list = await gh('/gists?per_page=100', {}, token);
      const g = list.find(x => x.files && x.files[FILE]);
      const prev = cfg; cfg = {token, pass};
      if (g){ cfg.gistId = g.id; try { await pull(); } catch(e){ cfg = prev; throw e; } }
      else {
        const created = await gh('/gists', {method:'POST', body:JSON.stringify({description:DESC, public:false, files:{[FILE]:{content: await encrypt(S, pass)}}})}, token);
        cfg.gistId = created.id;
      }
      saveCfg(); await run(); return !!g;
    },
    disconnect(){ cfg = {}; try { localStorage.removeItem(CFG_KEY); } catch(e){} state = 'off'; paint(); }
  };
})();

function balance(accId){
  const a = accById(accId); if(!a) return 0;
  let b = a.initial||0;
  for (const t of S.tx){
    if (t.type==='expense' && t.accountId===accId) b -= t.amount;
    else if (t.type==='income' && t.accountId===accId) b += t.amount;
    else if (t.type==='transfer'){ if (t.accountId===accId) b -= t.amount; if (t.toAccountId===accId) b += t.amount; }
  }
  return Math.round(b*100)/100;
}
const total = () => Math.round(S.accounts.reduce((s,a)=>s+balance(a.id),0)*100)/100;
const monthKey = (s) => s.slice(0,7);

function subMonthly(s){ return s.cycle==='yearly' ? s.amount/12 : s.amount; }
function noteTotals(n){ let inc=0, exp=0; for (const l of n.items){ if (l.amount==null) continue; if (l.amount>=0) inc+=l.amount; else exp+=-l.amount; } return {inc, exp, net:Math.round((inc-exp)*100)/100}; }

/* subscriptions: auto-charge when due */
function addMonths(dateStr, n, day){
  const [y,m] = dateStr.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(day,last));
  return ymd(d);
}
function processSubs(){
  const t = today(); let n = 0;
  for (const s of S.subs){
    if (!s.active || !s.next) continue;
    let guard = 0;
    while (s.next <= t && guard++ < 120){
      if (!S.tx.some(x=>x.id==='sub_'+s.id+'_'+s.next)) S.tx.push({id:'sub_'+s.id+'_'+s.next, type:'expense', amount:s.amount, accountId:s.accountId, place:s.name, category:s.category||'Συνδρομές', date:s.next, note:'Αυτόματη χρέωση συνδρομής', subId:s.id, created:Date.now()});
      s.next = addMonths(s.next, s.cycle==='yearly'?12:1, s.day || Number(s.next.slice(8,10)));
      n++;
    }
  }
  if (n){ save(); setTimeout(()=>toast(`Χρεώθηκαν αυτόματα ${n} συνδρομ${n===1?'ή':'ές'}`),400); }
}

/* count-up numbers */
const prevVals = {};
function countUp(fromZero){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const k = el.dataset.count, v = +el.dataset.v;
    const from = fromZero ? (prevVals[k] ?? 0) * (prevVals[k]===undefined?1:1) : (prevVals[k] ?? v);
    const start = (fromZero && prevVals[k]===undefined) ? 0 : from;
    prevVals[k] = v;
    if (RM || start===v){ el.textContent = fmt(v); return; }
    el.textContent = fmt(start);
    const t0 = performance.now(), dur = 1100;
    const step = (now)=>{ const p = Math.min(1,(now-t0)/dur); const e = 1-Math.pow(2,-10*p); el.textContent = fmt(p===1?v:start+(v-start)*e); if (p<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
/* animated segmented controls */
function initSegs(root){
  root.querySelectorAll('.seg').forEach(seg=>{
    let pill = seg.querySelector('.pill'); if (!pill){ pill = document.createElement('i'); pill.className='pill'; seg.prepend(pill); }
    const on = seg.querySelector('button.on'); if (!on){ pill.style.width='0'; return; }
    const place = ()=>{ pill.style.left = on.offsetLeft+'px'; pill.style.width = on.offsetWidth+'px'; };
    if (!seg.dataset.ready){ pill.style.transition='none'; place(); pill.offsetWidth; pill.style.transition=''; seg.dataset.ready='1'; } else place();
  });
}
function segMove(seg, btn){ seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b===btn)); initSegs(seg.parentNode); }

function barChart(){
  const now = today().slice(0,7)+'-01';
  const months = [...Array(6)].map((_,i)=>addMonths(now, i-5, 1).slice(0,7));
  const data = months.map(m=>({m, inc:monthSum('income',m), exp:monthSum('expense',m)}));
  const max = Math.max(1, ...data.flatMap(d=>[d.inc,d.exp]));
  const empty = data.every(d=>!d.inc && !d.exp);
  const narrow = innerWidth<820; const W=narrow?360:640,H=narrow?190:200,top=10,bottom=30,bw=narrow?13:20, step=W/6, ch=H-top-bottom;
  let g = `<defs><linearGradient id="gi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ci1)"/><stop offset="1" style="stop-color:var(--ci2)"/></linearGradient>
    <linearGradient id="ge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ce1)"/><stop offset="1" style="stop-color:var(--ce2)"/></linearGradient></defs>`;
  for (let i=0;i<=3;i++){ const y = top+ch*i/3; g += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.1)" stroke-dasharray="3 6"/>`; }
  data.forEach((d,i)=>{
    const cx = step*i + step/2;
    const hi = Math.max(ch*d.inc/max,3), he = Math.max(ch*d.exp/max,3);
    g += `<rect class="b" style="--d:${i}" x="${cx-bw-3}" y="${top+ch-hi}" width="${bw}" height="${hi}" rx="7" fill="url(#gi)"><title>Έσοδα ${fmt(d.inc)}</title></rect>`;
    g += `<rect class="b" style="--d:${i+.5}" x="${cx+3}" y="${top+ch-he}" width="${bw}" height="${he}" rx="7" fill="url(#ge)"><title>Έξοδα ${fmt(d.exp)}</title></rect>`;
    const lbl = new Date(d.m+'-01T00:00').toLocaleDateString('el-GR',{month:'short'});
    g += `<text x="${cx}" y="${H-6}" text-anchor="middle" fill="rgba(255,255,255,${i===5?.95:.6})" font-size="13" font-weight="${i===5?800:600}" font-family="Manrope">${lbl}</text>`;
  });
  return `<div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>${empty?'<div class="nodata">Τα δεδομένα θα εμφανιστούν μόλις γράψεις κινήσεις</div>':''}</div>`;
}

function parseLines(str, defSign){
  const out = [];
  for (let s of str.split(/\n/)){
    s = s.trim(); if (!s) continue;
    let sign = defSign;
    if (/^\+/.test(s)){ sign = 1; s = s.slice(1); } else if (/^[-−–]/.test(s)){ sign = -1; s = s.slice(1); }
    else if (/^[•*]\s/.test(s)){ sign = 0; s = s.slice(1); }
    const nums = sign===0 ? [] : [...s.matchAll(/(\d+(?:[.,]\d{1,2})?)\s*(?:€|ευρώ|ευρω|eur)?/gi)];
    if (!nums.length){ out.push({sign:0, amount:null, label:s.trim()}); continue; }
    const m = nums[nums.length-1];
    const label = (s.slice(0,m.index) + s.slice(m.index+m[0].length)).replace(/^[\s:\-–—,]+|[\s:\-–—,]+$/g,'').trim();
    out.push({sign, amount:num(m[1]), label: label || 'Χωρίς περιγραφή'});
  }
  return out;
}
function addNoteLines(n, text, sign, accId){
  const parsed = parseLines(text, sign);
  if (!parsed.length){ toast('Γράψε κάτι πρώτα'); return false; }
  for (const p of parsed){
    if (p.amount==null){ const line = {id:uid(), label:p.label, amount:null, done:false, date:today()}; n.items.push(line); flashId = line.id; continue; }
    const line = {id:uid(), label:p.label, amount:p.sign*p.amount, date:today()};
    if (accId){
      const tx = {id:uid(), created:Date.now(), type:p.sign>0?'income':'expense', amount:p.amount, accountId:accId, place:p.label, category:p.sign>0?'Project / Πελάτης':'Δουλειά', date:today(), note:n.name, noteId:n.id};
      S.tx.push(tx); line.txId = tx.id;
    }
    n.items.push(line); flashId = line.id;
  }
  n.lastAcc = accId; n.lastSign = sign; n.updated = Date.now();
  save(); render();
  toast(parsed.length>1 ? `Προστέθηκαν ${parsed.length} γραμμές` : parsed[0].amount==null ? 'Προστέθηκε σημείωση' : `${fmtS(parsed[0].sign*parsed[0].amount)} · ${parsed[0].label}`);
  setTimeout(()=>document.getElementById('qText')?.focus(), 50);
}

  initSegs(sheet);
  sheet.querySelectorAll('[data-ls]').forEach(b=>b.onclick=()=>{ sign = +b.dataset.ls; segMove(b.parentNode, b); });

function delLine(n, id){
  const l = n.items.find(x=>x.id===id); if (!l) return;
  if (l.txId && S.tx.some(x=>x.id===l.txId) && !confirm('Η γραμμή έχει μπει και σε λογαριασμό. Να διαγραφεί και η κίνηση;')) { n.items = n.items.filter(x=>x!==l); save(); render(); return; }
  S.tx = S.tx.filter(x=>x.id!==l.txId);
  n.items = n.items.filter(x=>x!==l); save(); render();
}

/* ============ agenda ============ */
const EV_COLORS = ['#8b7cc7','#c9c2e3','#4fd1a5','#7aa7ff','#ffd27a','#ff9f7a','#ff7ab6','#9ae6ff'];
const REPEATS = {none:'Καμία', daily:'Κάθε μέρα', weekdays:'Καθημερινές (Δευ–Παρ)', weekly:'Κάθε εβδομάδα', monthly:'Κάθε μήνα'};
let agSel = today(), agMonth = today().slice(0,7);
const toMin = (t) => { if (!t) return null; const [h,m] = t.split(':').map(Number); return h*60+m; };
const dow = (d) => new Date(d+'T00:00').getDay();
const shiftMonth = (mk, n) => addMonths(mk+'-01', n, 1).slice(0,7);
const addDays = (d, n) => { const x = new Date(d+'T00:00'); x.setDate(x.getDate()+n); return ymd(x); };
function occurs(e, d){
  if (d < e.date) return false;
  if (e.until && d > e.until) return false;
  if ((e.skip||[]).includes(d)) return false;
  switch (e.repeat){
    case 'daily': return true;
    case 'weekdays': { const w = dow(d); return w>=1 && w<=5; }
    case 'weekly': return dow(d)===dow(e.date);
    case 'monthly': return Number(d.slice(8))===Number(e.date.slice(8));
    default: return d===e.date;
  }
}
const isDone = (e, d) => (e.repeat && e.repeat!=='none') ? (e.doneDates||[]).includes(d) : !!e.done;
function eventsOn(d){ return (S.events||[]).filter(e=>occurs(e,d)).sort((a,b)=>(toMin(a.start)??-1)-(toMin(b.start)??-1) || a.title.localeCompare(b.title)); }
function toggleEvent(id, d){
  const e = S.events.find(x=>x.id===id); if (!e) return; d = d || e.date;
  if (e.repeat && e.repeat!=='none'){ e.doneDates = e.doneDates||[]; const i = e.doneDates.indexOf(d); if (i>=0) e.doneDates.splice(i,1); else e.doneDates.push(d); }
  else e.done = !e.done;
  save(); render(); if (isDone(e,d)) toast('Μπράβο! ✓ '+e.title);
}
const timeRange = (e) => e.start ? `${e.start}${e.end?'–'+e.end:''}` : 'Όλη μέρα';
function nowStatus(e, d){
  if (d!==today() || !e.start) return '';
  const now = new Date().getHours()*60+new Date().getMinutes(), s = toMin(e.start), en = toMin(e.end) ?? s+60;
  if (now>=s && now<en) return 'Τώρα';
  if (s>now && s-now<=90) return `σε ${s-now<60? (s-now)+'′' : Math.floor((s-now)/60)+'ω '+((s-now)%60?((s-now)%60)+'′':'')}`;
  return '';
}
function taskCard(e, d){
  const st = nowStatus(e, d);
  return `<div class="tcard${isDone(e,d)?' done':''}" style="--c:${e.color}" data-act="editEvent" data-id="${e.id}" data-date="${d}">
    <button class="chk${isDone(e,d)?' on':''}" data-act="toggleEvent" data-id="${e.id}" data-date="${d}" title="Έγινε">${svg('check')}</button>
    <div class="t"><span class="tm">${timeRange(e)}</span>${st?`<span class="tag">${st}</span>`:''}<b>${esc(e.title)}</b>${e.note?`<small class="muted" style="font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.note)}</small>`:''}</div></div>`;
}
function todayCard(){
  const d = today(), list = eventsOn(d), tom = eventsOn(addDays(d,1));
  const left = list.filter(e=>!isDone(e,d)).length;
  return `<section class="glass card c-today rise">
    <h3><span>Σήμερα · ${new Date().toLocaleDateString('el-GR',{weekday:'long',day:'numeric',month:'long'})}${list.length?` · <span style="color:var(--text)">${left ? left+' ακόμα' : 'όλα έγιναν 🎉'}</span>`:''}</span>
      <span class="row" style="gap:6px"><button class="btn sm ghost" data-act="openDay" data-date="${d}">${svg('cal')}Ατζέντα</button><button class="btn sm" data-act="newEvent" data-date="${d}">${svg('plus')}Νέο</button></span></h3>
    ${list.length ? `<div class="today-list">${list.map(e=>taskCard(e,d)).join('')}</div>`
      : `<p class="muted" style="font-size:13.5px;margin:8px 0 0">Τίποτα προγραμματισμένο για σήμερα. ${tom.length?`Αύριο έχεις ${tom.length}.`:''}</p>`}
    ${list.length && tom.length ? `<p class="faint" style="font-size:12px;margin:12px 0 0">Αύριο: ${tom.slice(0,3).map(e=>esc((e.start?e.start+' ':'')+e.title)).join(' · ')}${tom.length>3?' …':''}</p>`:''}
  </section>`;
}
function vAgenda(){
  const [y,m] = agMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1), startOff = (first.getDay()+6)%7; // Monday first
  const start = addDays(ymd(first), -startOff);
  let cells = '';
  for (let i=0;i<42;i++){
    const d = addDays(start, i); if (i>=35 && d.slice(0,7)!==agMonth) break;
    const evs = eventsOn(d);
    cells += `<button class="cal-day${d.slice(0,7)!==agMonth?' out':''}${d===today()?' today':''}${d===agSel?' sel':''}" data-act="calDay" data-date="${d}">${Number(d.slice(8))}<span class="cal-dots">${evs.slice(0,4).map(e=>`<i style="--c:${e.color}"></i>`).join('')}</span></button>`;
  }
  const list = eventsOn(agSel);
  const timed = list.filter(e=>e.start), allday = list.filter(e=>!e.start);
  const HOUR = 56;
  let h0 = 7, h1 = 23;
  for (const e of timed){ h0 = Math.min(h0, Math.floor(toMin(e.start)/60)); h1 = Math.max(h1, Math.ceil((toMin(e.end)??toMin(e.start)+60)/60)); }
  h1 = Math.min(24, h1);
  // overlap layout
  const items = timed.map(e=>({e, s:toMin(e.start), en:Math.max(toMin(e.end)??toMin(e.start)+60, toMin(e.start)+20)}));
  let cluster = [], cEnd = -1; const clusters = [];
  for (const it of items){ if (cluster.length && it.s>=cEnd){ clusters.push(cluster); cluster=[]; cEnd=-1; } cluster.push(it); cEnd = Math.max(cEnd, it.en); }
  if (cluster.length) clusters.push(cluster);
  for (const c of clusters){ const cols = []; for (const it of c){ let k = cols.findIndex(end=>end<=it.s); if (k<0){ k = cols.length; cols.push(0); } cols[k] = it.en; it.col = k; } c.forEach(it=>it.n = cols.length); }
  const evHtml = items.map(it=>{ const top = (it.s - h0*60)/60*HOUR, h = Math.max(24, (it.en-it.s)/60*HOUR - 3);
    return `<div class="ev${isDone(it.e,agSel)?' done':''}" style="--c:${it.e.color};top:${top+1}px;height:${h}px;left:calc(${it.col/it.n*100}% + 2px);width:calc(${100/it.n}% - 4px)" data-act="editEvent" data-id="${it.e.id}" data-date="${agSel}"><b>${esc(it.e.title)}</b>${h>34?`<small>${timeRange(it.e)}</small>`:''}</div>`; }).join('');
  let hours = ''; for (let h=h0; h<h1; h++) hours += `<div class="tl-hour" data-act="newEvent" data-date="${agSel}" data-time="${String(h).padStart(2,'0')}:00"><span>${String(h).padStart(2,'0')}:00</span></div>`;

function formEvent(e, opts={}){

  e = e || {title:'', date:opts.date||today(), start:st, end:plus1(st), color:EV_COLORS[(S.events.length)%EV_COLORS.length], repeat:'none', note:''};

    <div class="field"><label>Χρώμα</label><div class="ecolors">${EV_COLORS.map(c=>`<button type="button" style="background:${c}" class="${c===e.color?'on':''}" data-ecolor="${c}"></button>`).join('')}</div><input type="hidden" name="color" value="${e.color}"></div>
    <div class="field"><label>Επανάληψη</label><select class="inp" name="repeat">${Object.entries(REPEATS).map(([k,l])=>`<option value="${k}" ${e.repeat===k?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="field"><label>Σημείωση</label><input class="inp" name="note" value="${esc(e.note||'')}" placeholder="προαιρετικό"></div>

    ${actions(!isNew)}`, (fd)=>{
      const allday = !!fd.get('allday');
      let start = allday ? '' : fd.get('start'), end = allday ? '' : fd.get('end');

      const rec = {title:fd.get('title').trim(), date:fd.get('date'), start, end, color:fd.get('color'), repeat:fd.get('repeat'), note:fd.get('note').trim()};
      if (isNew){ S.events.push(Object.assign({id:uid(), created:Date.now(), done:false, doneDates:[]}, rec)); agSel = rec.date; agMonth = rec.date.slice(0,7); }
      else {
        Object.assign(e, rec);

        if (want !== isDone(e,occ)){ if (e.repeat!=='none'){ e.doneDates = e.doneDates||[]; if (want) e.doneDates.push(occ); else e.doneDates = e.doneDates.filter(x=>x!==occ); } else e.done = want; }

  };

/* turn a zip into a browsable site using blob: URLs */
const MIME = {html:'text/html',htm:'text/html',css:'text/css',js:'text/javascript',mjs:'text/javascript',json:'application/json',svg:'image/svg+xml',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',avif:'image/avif',ico:'image/x-icon',woff:'font/woff',woff2:'font/woff2',ttf:'font/ttf',otf:'font/otf',mp4:'video/mp4',webm:'video/webm',mp3:'audio/mpeg',wav:'audio/wav',txt:'text/plain',xml:'application/xml',pdf:'application/pdf',webmanifest:'application/manifest+json'};
const siteCache = new Map();
function normPath(p){ const out=[]; for (const s of p.split('/')){ if (!s||s==='.') continue; if (s==='..') out.pop(); else out.push(s); } return out.join('/'); }
async function buildSite(id){
  if (siteCache.has(id)) return siteCache.get(id);
  const p = await DB.get(id);
  const zip = await JSZip.loadAsync(p.blob);
  const entries = Object.values(zip.files).filter(f=>!f.dir && !/(^|\/)(__MACOSX|\.DS_Store)/.test(f.name));
  // site root = folder of the shallowest index.html (handles zips with a wrapper folder)
  const htmls = entries.filter(f=>/\.html?$/i.test(f.name)).map(f=>f.name).sort((a,b)=>a.split('/').length-b.split('/').length || (/index\.html?$/i.test(b)-/index\.html?$/i.test(a)));
  const entryFull = htmls.find(h=>/(^|\/)index\.html?$/i.test(h) && h.split('/').length===htmls[0].split('/').length) || htmls[0];
  const root = entryFull ? entryFull.split('/').slice(0,-1).join('/') : '';
  const raw = new Map(), text = new Map();
  for (const f of entries){
    let rel = f.name; if (root){ if (!rel.startsWith(root+'/')) continue; rel = rel.slice(root.length+1); }
    const ext = (rel.split('.').pop()||'').toLowerCase();
    if (/^(html?|css)$/.test(ext)) text.set(rel, await f.async('string'));
    else raw.set(rel, new Blob([await f.async('uint8array')], {type: MIME[ext]||'application/octet-stream'}));
  }
  const urls = new Map(); const cssDone = new Map();
  const resolve = (from, ref) => {
    if (!ref || /^(data:|blob:|https?:|\/\/|mailto:|tel:|#|javascript:)/i.test(ref.trim())) return null;
    const clean = ref.trim().split('#')[0].split('?')[0]; if (!clean) return null;
    let path = clean.startsWith('/') ? clean.slice(1) : normPath(from.split('/').slice(0,-1).concat(clean).join('/'));
    try { path = decodeURIComponent(path); } catch(e){}
    path = normPath(path);
    if (raw.has(path) || text.has(path)) return path;
    for (const c of [path+'/index.html', path+'.html', path+'index.html']) if (text.has(normPath(c))) return normPath(c);
    return null;
  };
  const assetUrl = (path) => {
    if (/\.html?$/i.test(path)) return null;
    if (urls.has(path)) return urls.get(path);
    let u;
    if (/\.css$/i.test(path)) u = URL.createObjectURL(new Blob([cssRewrite(path, text.get(path))],{type:'text/css'}));
    else u = URL.createObjectURL(raw.get(path));
    urls.set(path,u); return u;
  };
  function cssRewrite(from, css){
    if (cssDone.has(from)) return cssDone.get(from);
    cssDone.set(from, css); // guard cycles
    const out = css.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (m,q,ref)=>{ const p = resolve(from, ref); return p && !/\.html?$/i.test(p) ? `url("${assetUrl(p)}")` : m; })
                   .replace(/@import\s+(['"])([^'"]+)\1/g, (m,q,ref)=>{ const p = resolve(from, ref); return p ? `@import "${assetUrl(p)}"` : m; });
    cssDone.set(from, out); return out;
  }
  const navScript = `<script>document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[data-zipnav]');if(!a)return;e.preventDefault();parent.postMessage({zipnav:a.getAttribute('data-zipnav')},'*');},true);<\/script>`;
  const htmlCache = new Map();
  function render(path){
    if (htmlCache.has(path)) return htmlCache.get(path);
    const doc = new DOMParser().parseFromString(text.get(path), 'text/html');
    doc.querySelectorAll('base').forEach(b=>b.remove());
    for (const el of doc.querySelectorAll('[src],[href],[poster],[data-src]')){
      for (const attr of ['src','href','poster','data-src']){
        const v = el.getAttribute(attr); if (v==null) continue;
        const p = resolve(path, v); if (!p) continue;
        if (/\.html?$/i.test(p)){ if (el.tagName==='A'){ el.setAttribute('href','#'); el.setAttribute('data-zipnav', p); } }
        else el.setAttribute(attr, assetUrl(p));
      }
    }
    for (const el of doc.querySelectorAll('[srcset]')){
      el.setAttribute('srcset', el.getAttribute('srcset').split(',').map(part=>{ const [u,...rest] = part.trim().split(/\s+/); const p = resolve(path,u); return [p?assetUrl(p):u, ...rest].join(' '); }).join(', '));
    }
    for (const st of doc.querySelectorAll('style')) st.textContent = cssRewrite(path+'#inline'+Math.random(), st.textContent);
    for (const el of doc.querySelectorAll('[style]')) el.setAttribute('style', cssRewrite(path+'#attr'+Math.random(), el.getAttribute('style')));
    const html = '<!doctype html>\n' + doc.documentElement.outerHTML.replace(/<\/body>/i, navScript+'</body>');
    const u = URL.createObjectURL(new Blob([html],{type:'text/html'}));
    htmlCache.set(path,u); return u;
  }
  const site = { name:p.name, entry: entryFull ? entryFull.slice(root?root.length+1:0) : null, pages:[...text.keys()].filter(k=>/\.html?$/i.test(k)).sort(), all:[...text.keys(), ...raw.keys()].sort(), render, text, raw };
  siteCache.set(id, site); return site;
}

/* ============ particles ============ */
(function particles(){
  const c = document.getElementById('fx'), x = c.getContext('2d');
  let W, H, dpr, P = [], mouse = {x:-999,y:-999}, PT='235,255,245', PL='190,255,225';
  function size(){ dpr = Math.min(2, devicePixelRatio||1); W = innerWidth; H = innerHeight; c.width = W*dpr; c.height = H*dpr; c.style.width=W+'px'; c.style.height=H+'px'; x.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(90, W*H/16000));
    P = Array.from({length:n}, ()=>({x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.18, vy:(Math.random()-.5)*.18-.05, r:Math.random()*1.6+.4, a:Math.random()*.5+.2, tw:Math.random()*6.28})); }
  size(); addEventListener('resize', size);
  addEventListener('pointermove', e=>{ mouse.x=e.clientX; mouse.y=e.clientY; }, {passive:true});
  function frame(t){
    x.clearRect(0,0,W,H);
    const th = document.documentElement.dataset.theme; if (frame.k!==th){ frame.k = th; const cs = getComputedStyle(document.documentElement); PT = cs.getPropertyValue('--pt').trim(); PL = cs.getPropertyValue('--pl').trim(); }
    for (const p of P){
      const dx = p.x-mouse.x, dy = p.y-mouse.y, d2 = dx*dx+dy*dy;
      if (d2 < 22000){ const f = (1-d2/22000)*.6; p.x += dx/Math.sqrt(d2+1)*f; p.y += dy/Math.sqrt(d2+1)*f; }
      p.x += p.vx; p.y += p.vy;
      if (p.x<-10) p.x=W+10; if (p.x>W+10) p.x=-10; if (p.y<-10) p.y=H+10; if (p.y>H+10) p.y=-10;
      const a = p.a*(.6+.4*Math.sin(t/900+p.tw));
      x.beginPath(); x.arc(p.x,p.y,p.r,0,6.283); x.fillStyle = `rgba(${PT},${a})`; x.fill();
    }
    x.lineWidth = .6;
    for (let i=0;i<P.length;i++) for (let j=i+1;j<P.length;j++){
      const a = P[i], b = P[j], dx = a.x-b.x, dy = a.y-b.y, d = dx*dx+dy*dy;
      if (d < 11000){ x.strokeStyle = `rgba(${PL},${(1-d/11000)*.12})`; x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke(); }
    }
    if (!RM && !document.hidden) requestAnimationFrame(frame); else if (!RM) document.addEventListener('visibilitychange', ()=>requestAnimationFrame(frame), {once:true});
  }
  requestAnimationFrame(frame);
})();

let asciiRaf = null;
function startAscii(){
  stopAscii();

  const chars = ' .·:-=+*%#@';
  let cols = 0, rows = 0, last = 0;
  const measure = ()=>{ const r = pre.getBoundingClientRect(); cols = Math.max(10, Math.floor((r.width-28)/7.3)); rows = Math.max(6, Math.floor((r.height-28)/11.55)); };
  measure();
  const spentRatio = Math.min(2, (monthSum('expense', today().slice(0,7)) / Math.max(1, monthSum('income', today().slice(0,7)) || 1)));
  const speed = .6 + Math.min(1, spentRatio) * .8;
  const draw = (t)=>{
    if (!document.getElementById('asciiPre')) return stopAscii();
    if (t - last > 66){
      last = t; const T = t/1000*speed; let s = '';
      for (let y=0;y<rows;y++){
        for (let x=0;x<cols;x++){
          const v = Math.sin(x*.16 + T) + Math.sin(y*.32 - T*1.3) + Math.sin((x+y)*.09 + T*.7) + Math.cos(Math.hypot(x-cols/2, (y-rows/2)*2)*.18 - T*1.6);
          s += chars[Math.max(0, Math.min(chars.length-1, Math.floor((v+4)/8*chars.length)))];
        }
        s += '\n';
      }
      pre.textContent = s;
    }
    if (!RM) asciiRaf = requestAnimationFrame(draw);
  };
  addEventListener('resize', measure);
  asciiRaf = requestAnimationFrame(draw);
}
function stopAscii(){ if (asciiRaf) cancelAnimationFrame(asciiRaf); asciiRaf = null; }

buildSnap(); applyTheme(); processSubs(); render(); Sync.paint(); Sync.run();
setInterval(()=>{ if (!document.hidden) Sync.run(); }, 45000);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
