/* ============ agenda ============ */
const EV_COLORS = ['#8b7cc7','#c9c2e3','#4fd1a5','#7aa7ff','#ffd27a','#ff9f7a','#ff7ab6','#9ae6ff'];
const REPEATS = {none:'Καμία', daily:'Κάθε μέρα', weekdays:'Καθημερινές (Δευ–Παρ)', weekly:'Κάθε εβδομάδα', monthly:'Κάθε μήνα'};
let agSel = today(), agMonth = today().slice(0,7);
const toMin = (t) => { if (!t) return null; const [h,m] = t.split(':').map(Number); return h*60+m; };
const dow = (d) => new Date(d+'T00:00').getDay();
const shiftMonth = (mk, n) => addMonths(mk+'-01', n, 1).slice(0,7);
const addDays = (d, n) => { const x = new Date(d+'T00:00'); x.setDate(x.getDate()+n); return ymd(x); };
function occurs(e, d){
  if (d < e.date) return false;
  if (e.until && d > e.until) return false;
  if ((e.skip||[]).includes(d)) return false;
  switch (e.repeat){
    case 'daily': return true;
    case 'weekdays': { const w = dow(d); return w>=1 && w<=5; }
    case 'weekly': return dow(d)===dow(e.date);
    case 'monthly': return Number(d.slice(8))===Number(e.date.slice(8));
    default: return d===e.date;
  }
}
const isDone = (e, d) => (e.repeat && e.repeat!=='none') ? (e.doneDates||[]).includes(d) : !!e.done;
function eventsOn(d){ return (S.events||[]).filter(e=>occurs(e,d)).sort((a,b)=>(toMin(a.start)??-1)-(toMin(b.start)??-1) || a.title.localeCompare(b.title)); }
function toggleEvent(id, d){
  const e = S.events.find(x=>x.id===id); if (!e) return; d = d || e.date;
  if (e.repeat && e.repeat!=='none'){ e.doneDates = e.doneDates||[]; const i = e.doneDates.indexOf(d); if (i>=0) e.doneDates.splice(i,1); else e.doneDates.push(d); }
  else e.done = !e.done;
  save(); render(); if (isDone(e,d)) toast('Μπράβο! ✓ '+e.title);
}
const overnight = (e) => !!(e.start && e.end && toMin(e.end) <= toMin(e.start));
const endMin = (e) => e.end ? (overnight(e) ? toMin(e.end)+1440 : toMin(e.end)) : toMin(e.start)+60;
const carryOn = (d) => eventsOn(addDays(d,-1)).filter(overnight).map(e=>({e, cont:true}));
const timeRange = (e, cont) => cont ? `μέχρι ${e.end} · από χθες` : e.start ? `${e.start}${e.end?'–'+e.end:''}${overnight(e)?' (+1)':''}` : 'Όλη μέρα';
function nowStatus(e, d){
  if (d!==today() || !e.start) return '';
  const now = new Date().getHours()*60+new Date().getMinutes(), s = toMin(e.start), en = endMin(e);
  if (now>=s && now<en) return 'Τώρα';
  if (s>now && s-now<=90) return `σε ${s-now<60? (s-now)+'′' : Math.floor((s-now)/60)+'ω '+((s-now)%60?((s-now)%60)+'′':'')}`;
  return '';
}
function taskCard(e, d, cont){
  const st = cont ? ((new Date().getHours()*60+new Date().getMinutes()) < toMin(e.end) && d===today() ? 'Τώρα' : '') : nowStatus(e, d);
  if (cont) d = addDays(d,-1);
  return `<div class="tcard${isDone(e,d)?' done':''}" style="--c:${e.color}" data-act="editEvent" data-id="${e.id}" data-date="${d}">
    <button class="chk${isDone(e,d)?' on':''}" data-act="toggleEvent" data-id="${e.id}" data-date="${d}" title="Έγινε">${svg('check')}</button>
    <div class="t"><span class="tm">${timeRange(e, cont)}</span>${st?`<span class="tag">${st}</span>`:''}<b>${esc(e.title)}</b>${e.note?`<small class="muted" style="font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.note)}</small>`:''}</div></div>`;
}
function todayCard(){
  const d = today(), list = eventsOn(d), tom = eventsOn(addDays(d,1));
  const nowM = new Date().getHours()*60+new Date().getMinutes();
  const carry = carryOn(d).filter(c=>toMin(c.e.end) > nowM);
  const left = list.filter(e=>!isDone(e,d)).length;
  return `<section class="glass card c-today rise">
    <h3><span>Σήμερα · ${new Date().toLocaleDateString('el-GR',{weekday:'long',day:'numeric',month:'long'})}${list.length?` · <span style="color:var(--text)">${left ? left+' ακόμα' : 'όλα έγιναν 🎉'}</span>`:''}</span>
      <span class="row" style="gap:6px"><button class="btn sm ghost" data-act="openDay" data-date="${d}">${svg('cal')}Ατζέντα</button><button class="btn sm" data-act="newEvent" data-date="${d}">${svg('plus')}Νέο</button></span></h3>
    ${list.length||carry.length ? `<div class="today-list">${carry.map(c=>taskCard(c.e,d,true)).join('')}${list.map(e=>taskCard(e,d)).join('')}</div>`
      : `<p class="muted" style="font-size:13.5px;margin:8px 0 0">Τίποτα προγραμματισμένο για σήμερα. ${tom.length?`Αύριο έχεις ${tom.length}.`:''}</p>`}
    ${list.length && tom.length ? `<p class="faint" style="font-size:12px;margin:12px 0 0">Αύριο: ${tom.slice(0,3).map(e=>esc((e.start?e.start+' ':'')+e.title)).join(' · ')}${tom.length>3?' …':''}</p>`:''}
  </section>`;
}
function vAgenda(){
  const [y,m] = agMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1), startOff = (first.getDay()+6)%7; // Monday first
  const start = addDays(ymd(first), -startOff);
  let cells = '';
  for (let i=0;i<42;i++){
    const d = addDays(start, i); if (i>=35 && d.slice(0,7)!==agMonth) break;
    const evs = eventsOn(d);
    cells += `<button class="cal-day${d.slice(0,7)!==agMonth?' out':''}${d===today()?' today':''}${d===agSel?' sel':''}" data-act="calDay" data-date="${d}">${Number(d.slice(8))}<span class="cal-dots">${evs.slice(0,4).map(e=>`<i style="--c:${e.color}"></i>`).join('')}</span></button>`;
  }
  const list = eventsOn(agSel);
  const timed = list.filter(e=>e.start), allday = list.filter(e=>!e.start), carry = carryOn(agSel);
  const HOUR = 56;
  const h0 = 0, h1 = 24;
  // overlap layout
  const items = carry.map(c=>({e:c.e, cont:true, s:0, en:Math.max(toMin(c.e.end),20)})).concat(timed.map(e=>({e, s:toMin(e.start), en:Math.min(Math.max(endMin(e), toMin(e.start)+20), 1440)})));
  let cluster = [], cEnd = -1; const clusters = [];
  for (const it of items){ if (cluster.length && it.s>=cEnd){ clusters.push(cluster); cluster=[]; cEnd=-1; } cluster.push(it); cEnd = Math.max(cEnd, it.en); }
  if (cluster.length) clusters.push(cluster);
  for (const c of clusters){ const cols = []; for (const it of c){ let k = cols.findIndex(end=>end<=it.s); if (k<0){ k = cols.length; cols.push(0); } cols[k] = it.en; it.col = k; } c.forEach(it=>it.n = cols.length); }
  const evHtml = items.map(it=>{ const top = (it.s - h0*60)/60*HOUR, h = Math.max(24, (it.en-it.s)/60*HOUR - 3);
    return `<div class="ev${isDone(it.e,agSel)?' done':''}" style="--c:${it.e.color};top:${top+1}px;height:${h}px;left:calc(${it.col/it.n*100}% + 2px);width:calc(${100/it.n}% - 4px)" data-act="editEvent" data-id="${it.e.id}" data-date="${it.cont?addDays(agSel,-1):agSel}"><b>${esc(it.e.title)}</b>${h>34?`<small>${timeRange(it.e, it.cont)}</small>`:''}</div>`; }).join('');
  let hours = ''; for (let h=h0; h<h1; h++) hours += `<div class="tl-hour" data-act="newEvent" data-date="${agSel}" data-time="${String(h).padStart(2,'0')}:00"><span>${String(h).padStart(2,'0')}:00</span></div>`;
  const now = new Date(), nowMin = now.getHours()*60+now.getMinutes();
  const nowLine = agSel===today() && nowMin>=h0*60 && nowMin<h1*60 ? `<div class="now-line" id="nowLine" style="top:${(nowMin-h0*60)/60*HOUR}px"></div>` : '';
  const selLabel = new Date(agSel+'T00:00').toLocaleDateString('el-GR',{weekday:'long',day:'numeric',month:'long'});
  const left = list.filter(e=>!isDone(e,agSel)).length;
  return `<div class="top rise"><div><h1>Ατζέντα</h1><p>${agSel===today()?'Σήμερα, ':''}${selLabel} · ${list.length ? `${list.length} πράγματα${left!==list.length?`, ${left} ακόμα`:''}` : 'ελεύθερη μέρα'}</p></div>
    <div class="row"><button class="btn" data-act="calToday">Σήμερα</button><button class="btn primary hide-m" data-act="newEvent" data-date="${agSel}">${svg('plus')}Νέο task</button></div></div>
  <div class="agenda">
    <section class="glass card rise">
      <div class="between"><button class="iconbtn" data-act="calPrev" title="Προηγούμενος μήνας">${svg('back')}</button>
        <b style="font-size:17px;text-transform:capitalize">${first.toLocaleDateString('el-GR',{month:'long',year:'numeric'})}</b>
        <button class="iconbtn" data-act="calNext" title="Επόμενος μήνας">${svg('next')}</button></div>
      <div class="cal-grid">${['Δε','Τρ','Τε','Πε','Πα','Σα','Κυ'].map(x=>`<div class="cal-dow">${x}</div>`).join('')}${cells}</div>
    </section>
    <section class="glass card rise">
      <h3><span style="text-transform:capitalize">${selLabel}</span><button class="btn sm" data-act="newEvent" data-date="${agSel}">${svg('plus')}Νέο</button></h3>
      ${allday.length?`<div class="allday">${allday.map(e=>taskCard(e,agSel)).join('')}</div>`:''}
      <div class="tl-scroll" id="tlScroll" data-day="${agSel}" data-focus="${agSel===today()?nowMin:(items.length?items[0].s:7*60)}"><div class="tl" id="tl">${hours}<div class="tl-end"><span>24:00</span></div><div class="tl-ev">${evHtml}</div>${nowLine}</div></div>
      ${!list.length?'<p class="hint" style="text-align:center">Πάτα σε μια ώρα για να προσθέσεις κάτι εκεί.</p>':''}
    </section>
  </div>`;
}
let tlMem = {day:null, top:0};
function scrollTimeline(){
  const sc = document.getElementById('tlScroll'); if (!sc) return;
  const day = sc.dataset.day;
  if (tlMem.day===day && !enterNext){ sc.scrollTop = tlMem.top; }
  else { const f = +sc.dataset.focus; sc.scrollTop = Math.max(0, (f/60 - 1.5) * 56); }
  tlMem.day = day; tlMem.top = sc.scrollTop;
  sc.onscroll = ()=>{ tlMem.top = sc.scrollTop; };
}

    <div class="field"><label>Μέχρι <span id="nextDay" style="color:var(--accent-2);display:none">· επόμενη μέρα</span></label><input class="inp tpin" name="end" value="${e.end||plus1(e.start||st)}" data-time autocomplete="off" inputmode="numeric" maxlength="5"></div></div>
    <div class="field"><label>Χρώμα</label><div class="ecolors">${EV_COLORS.map(c=>`<button type="button" style="background:${c}" class="${c===e.color?'on':''}" data-ecolor="${c}"></button>`).join('')}</div><input type="hidden" name="color" value="${e.color}"></div>

    <div class="field"><label>Σημείωση</label><input class="inp" name="note" value="${esc(e.note||'')}" placeholder="προαιρετικό"></div>
    ${!isNew?`<label class="switch"><input type="checkbox" name="done" ${isDone(e,occ)?'checked':''}>Έγινε${e.repeat&&e.repeat!=='none'?' (αυτή τη μέρα)':''}</label>`:''}
    ${actions(!isNew)}`, (fd)=>{
      const allday = !!fd.get('allday');
      let start = allday ? '' : (normTime(fd.get('start'))||st), end = allday ? '' : (normTime(fd.get('end'))||plus1(start));
      if (start && end && toMin(end) === toMin(start)) end = plus1(start);
      const rec = {title:fd.get('title').trim(), date:fd.get('date'), start, end, color:fd.get('color'), repeat:fd.get('repeat'), note:fd.get('note').trim()};
      if (isNew){ S.events.push(Object.assign({id:uid(), created:Date.now(), done:false, doneDates:[]}, rec)); agSel = rec.date; agMonth = rec.date.slice(0,7); }
      else {
        Object.assign(e, rec);
        const want = !!fd.get('done');
        if (want !== isDone(e,occ)){ if (e.repeat!=='none'){ e.doneDates = e.doneDates||[]; if (want) e.doneDates.push(occ); else e.doneDates = e.doneDates.filter(x=>x!==occ); } else e.done = want; }
      }
      save(); render(); toast(isNew ? `Προστέθηκε: ${rec.title}` : 'Αποθηκεύτηκε');
    });
  const ad = sheet.querySelector('[name=allday]'); ad.onchange = ()=>{ document.getElementById('times').style.display = ad.checked ? 'none' : ''; };
  const sIn = sheet.querySelector('[name=start]'), eIn = sheet.querySelector('[name=end]');

  sIn.onchange = ()=>{ if (toMin(eIn.value) === toMin(sIn.value)) eIn.value = plus1(sIn.value); hint(); }; eIn.onchange = hint; eIn.oninput = hint; hint();

/* glass time picker (replaces the browser's own, which scrolls badly on desktop) */
const TP = { el:null, inp:null };
function normTime(v){
  const d = String(v||'').replace(/[^\d]/g,''); if (!d) return '';
  let h, m; if (d.length<=2){ h=+d; m=0; } else if (d.length===3){ h=+d[0]; m=+d.slice(1); } else { h=+d.slice(0,2); m=+d.slice(2,4); }
  if (h>23 || m>59) return null; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function tpSet(inp, v){ if (inp.value===v) return; inp.value = v; inp.dispatchEvent(new Event('input',{bubbles:true})); inp.dispatchEvent(new Event('change',{bubbles:true})); }
function tpOpen(inp){
  if (TP.inp===inp && TP.el.classList.contains('open')) return;
  tpClose(); TP.inp = inp;
  if (!TP.el){ TP.el = document.createElement('div'); TP.el.className = 'tpop'; document.body.appendChild(TP.el);
    TP.el.addEventListener('pointerdown', e=>e.preventDefault());
    TP.el.addEventListener('click', e=>{ const b = e.target.closest('button'); if (!b || !TP.inp) return;
      const [h,m] = (normTime(TP.inp.value)||'09:00').split(':');
      if (b.dataset.h!=null){ tpSet(TP.inp, b.dataset.h+':'+m); tpPaint(); }
      else { tpSet(TP.inp, h+':'+b.dataset.m); tpClose(); } }); }
  const [h,m] = (normTime(inp.value)||'09:00').split(':');
  const mins = [...Array(12)].map((_,i)=>String(i*5).padStart(2,'0')); if (!mins.includes(m)) { mins.push(m); mins.sort(); }
  TP.el.innerHTML = `<div class="tcol" data-col="h"><b>Ώρα</b>${[...Array(24)].map((_,i)=>{ const v=String(i).padStart(2,'0'); return `<button type="button" data-h="${v}">${v}</button>`; }).join('')}</div>
    <div class="tcol" data-col="m"><b>Λεπτά</b>${mins.map(v=>`<button type="button" data-m="${v}">${v}</button>`).join('')}</div>`;
  tpPlace(); tpPaint(true); requestAnimationFrame(()=>TP.el.classList.add('open'));
}
function tpPaint(scroll){
  const [h,m] = (normTime(TP.inp.value)||'09:00').split(':');
  TP.el.querySelectorAll('[data-h]').forEach(b=>b.classList.toggle('on', b.dataset.h===h));
  TP.el.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on', b.dataset.m===m));
  if (scroll) TP.el.querySelectorAll('.tcol').forEach(c=>{ const on = c.querySelector('.on'); if (on) c.scrollTop = on.offsetTop - c.clientHeight/2 + on.offsetHeight/2; });
}
function tpPlace(){
  if (!TP.inp) return; const r = TP.inp.getBoundingClientRect(), w = 140, hgt = 248;
  let top = r.bottom + 6; if (top + hgt > innerHeight - 8) top = Math.max(8, r.top - hgt - 6);
  TP.el.style.left = Math.min(Math.max(8, r.left + r.width/2 - w/2), innerWidth - w - 8) + 'px'; TP.el.style.top = top + 'px';
}
function tpClose(){ if (TP.el) TP.el.classList.remove('open'); if (TP.inp){ const n = normTime(TP.inp.value); if (n) tpSet(TP.inp, n); } TP.inp = null; }
document.addEventListener('focusin', e=>{ if (e.target.matches && e.target.matches('input[data-time]')) tpOpen(e.target); else if (TP.inp && !(TP.el && TP.el.contains(e.target))) tpClose(); });
document.addEventListener('click', e=>{ if (e.target.matches && e.target.matches('input[data-time]')) tpOpen(e.target); });
document.addEventListener('pointerdown', e=>{ if (TP.inp && e.target!==TP.inp && !(TP.el && TP.el.contains(e.target))) tpClose(); }, true);
document.addEventListener('keydown', e=>{ if (TP.inp && (e.key==='Escape' || e.key==='Enter' || e.key==='Tab')){ if (e.key==='Escape') e.stopPropagation(); if (e.key==='Enter') e.preventDefault(); tpClose(); } }, true);
document.addEventListener('input', e=>{ if (TP.inp && e.target===TP.inp && TP.el) tpPaint(true); });
addEventListener('resize', tpPlace); document.addEventListener('scroll', ()=>{ if (TP.inp) tpPlace(); }, true);

async function hydrateProjects(){

/* ============ projects (IndexedDB + zip preview) ============ */
const DB = { db:null,
  open(){ return this.db ? Promise.resolve(this.db) : new Promise((res,rej)=>{ const r = indexedDB.open('spyr-projects',1);
    r.onupgradeneeded = ()=>{ r.result.createObjectStore('projects',{keyPath:'id'}); };
    r.onsuccess = ()=>{ this.db = r.result; res(this.db); }; r.onerror = ()=>rej(r.error); }); },
  async tx(mode, fn){ const db = await this.open(); return new Promise((res,rej)=>{ const t = db.transaction('projects',mode); const st = t.objectStore('projects'); const out = fn(st); t.oncomplete=()=>res(out && out.result!==undefined ? out.result : out); t.onerror=()=>rej(t.error); }); },
  all(){ return this.tx('readonly', st=>st.getAll()); },
  get(id){ return this.tx('readonly', st=>st.get(id)); },
  put(p){ return this.tx('readwrite', st=>st.put(p)); },
  del(id){ return this.tx('readwrite', st=>st.delete(id)); }
};
function pickZip(replaceId){
  const i = document.createElement('input'); i.type='file'; i.accept='.zip,application/zip'; if (!replaceId) i.multiple = true;
  i.onchange = ()=>[...i.files].forEach(f=>addZip(f, typeof replaceId==='string'?replaceId:null)); i.click();
}
async function addZip(file, replaceId){
  if (!/\.zip$/i.test(file.name)){ toast('Μόνο αρχεία .zip'); return; }
  try {
    const zip = await JSZip.loadAsync(file);
    const files = Object.values(zip.files).filter(f=>!f.dir && !ZIP_JUNK.test(f.name));
    const isSrc = !files.some(f=>/\.html?$/i.test(f.name)) && files.some(f=>/(^|\/)package\.json$/.test(f.name));
    if (!files.some(f=>/\.html?$/i.test(f.name)) && !isSrc) toast('Προσοχή: δεν βρέθηκε αρχείο .html στο zip');
    const old = replaceId ? await DB.get(replaceId) : null;
    const p = { id: replaceId||uid(), name: old?.name || await zipName(zip, files, file.name), notes: old?.notes||'', blob:file, size:file.size, files:files.length, created: old?.created||Date.now(), updated:Date.now() };
    await DB.put(p); siteCache.delete(p.id); navigator.serviceWorker?.controller?.postMessage({zipFlush:p.id});
    toast(replaceId?'Ενημερώθηκε το project':'Προστέθηκε το project'); if (view==='projects') render();
  } catch(e){ console.error(e); toast('Δεν άνοιξε το zip'); }
}
const ZIP_JUNK = /(^|\/)(__MACOSX|\.DS_Store|Thumbs\.db)|(^|\/)(node_modules|\.git|\.next|\.vercel|\.turbo)\//;
const badName = n => !n || /^\$R[A-Z0-9]{4,}$/i.test(n) || /^[A-Z0-9$_-]{6,}$/.test(n) && !/[a-z]/.test(n) && /\d/.test(n);
async function zipName(zip, files, fname){
  const base = fname.replace(/\.zip$/i,'');
  const tops = new Set(files.map(f=>f.name.split('/')[0]));
  const folder = tops.size===1 && files.every(f=>f.name.includes('/')) ? [...tops][0] : null;
  let pkg = null; const pj = files.filter(f=>/(^|\/)package\.json$/.test(f.name)).sort((a,b)=>a.name.length-b.name.length)[0];
  if (pj){ try { pkg = JSON.parse(await pj.async('string')).name; } catch(e){} }
  if (!badName(base)) return base;
  return folder || pkg || base;
}

/* turn a zip into a browsable site using blob: URLs */
const MIME = {html:'text/html',htm:'text/html',css:'text/css',js:'text/javascript',mjs:'text/javascript',json:'application/json',svg:'image/svg+xml',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',avif:'image/avif',ico:'image/x-icon',woff:'font/woff',woff2:'font/woff2',ttf:'font/ttf',otf:'font/otf',mp4:'video/mp4',webm:'video/webm',mp3:'audio/mpeg',wav:'audio/wav',txt:'text/plain',xml:'application/xml',pdf:'application/pdf',webmanifest:'application/manifest+json'};
const siteCache = new Map();
function normPath(p){ const out=[]; for (const s of p.split('/')){ if (!s||s==='.') continue; if (s==='..') out.pop(); else out.push(s); } return out.join('/'); }
async function buildSite(id){
  if (siteCache.has(id)) return siteCache.get(id);
  const p = await DB.get(id);
  const zip = await JSZip.loadAsync(p.blob);
  const entries = Object.values(zip.files).filter(f=>!f.dir && !ZIP_JUNK.test(f.name));
  // site root = folder of the best index.html: a built output (dist/out/build) wins, then the shallowest one
  const depth = n => n.split('/').length;
  const BUILT = /(^|\/)(dist|out|build|_site|www|public_html)\/[^/]*\.html?$/i;
  let htmls = entries.filter(f=>/\.html?$/i.test(f.name)).map(f=>f.name);
  const srcHtml = new Set();
  for (const h of htmls){ if (BUILT.test(h)) continue; const t = await zip.file(h).async('string');
    if (/<script[^>]+src=["'][^"']+\.(tsx|jsx|ts|vue|svelte)["']/i.test(t)) srcHtml.add(h); }
  const rank = h => (BUILT.test(h) ? 0 : 1000) + depth(h)*10 + (/(^|\/)index\.html?$/i.test(h) ? 0 : 5);
  htmls = htmls.filter(h=>!srcHtml.has(h)).sort((a,b)=>rank(a)-rank(b));
  let entryFull = htmls[0] || null;

function askAnswer(q){
  const mk = today().slice(0,7);
  const spentRange = (from, to) => S.tx.filter(t=>t.type==='expense' && !isLoanish(t) && t.date>=from && t.date<=to).reduce((s,t)=>s+t.amount,0);
  if (/χρωστ|δανεικ/.test(q)){ const L = openLoans(); if (!L.length) return 'Δεν σου χρωστάει κανείς 🙂'; const by = {}; L.forEach(l=>{ by[l.place] = (by[l.place]||0)+loanLeft(l); });
    return `Σου χρωστάνε <b style="color:var(--loan)">+${fmt(loansTotal())}</b><br>` + Object.entries(by).map(([w,v])=>`${esc(w)}: <b>${fmt(v)}</b>`).join(' · '); }
  if (/υπολοιπ/.test(q)) return `Συνολικό υπόλοιπο ${fmt(total())}<br>` + S.accounts.map(a=>`${esc(a.name)}: <b>${fmt(balance(a.id))}</b>`).join(' · ');
  if (/τι εχω|τι πρεπει|προγραμμα/.test(q)){ const d = /αυριο/.test(q) ? ymd(dShift(new Date(),1)) : today(); const ev = eventsOn(d);
    return (d===today()?'Σήμερα':'Αύριο') + (ev.length ? ':<br>' + ev.map(e=>`${e.start?`<b>${e.start}</b> `:''}${esc(e.title)}${isDone(e,d)?' ✓':''}`).join('<br>') : ' δεν έχεις τίποτα στην ατζέντα.'); }
  if (/σημερα/.test(q)) return `Σήμερα ξόδεψες <b>${fmt(spentRange(today(), today()))}</b>.`;
  if (/εβδομαδα/.test(q)){ const d = new Date(); const from = ymd(dShift(d, -((d.getDay()+6)%7))); return `Αυτή την εβδομάδα ξόδεψες <b>${fmt(spentRange(from, today()))}</b>.`; }
  if (/εβγαλα|εσοδ|μπηκαν/.test(q)) return `Αυτόν τον μήνα μπήκαν <b>${fmt(monthSum('income', mk))}</b>.`;
  // per category this month
  const cats = [...catList('expense'), ...catList('income')];
  const hit = cats.find(c=>nrm(c[0]).split(/[\s/]+/).some(k=>k.length>=3 && q.split(' ').some(w=>stemEq(w,k))));
  if (hit) { const v = S.tx.filter(t=>t.category===hit[0] && monthKey(t.date)===mk).reduce((s,t)=>s+t.amount,0); return `${hit[1]} ${esc(hit[0])} αυτόν τον μήνα: <b>${fmt(v)}</b>.`; }
  return `Αυτόν τον μήνα ξόδεψες <b>${fmt(monthSum('expense', mk))}</b> και μπήκαν <b>${fmt(monthSum('income', mk))}</b>.`;
}

function previewHtml(p){

  const c = (cls, html) => `<span class="pc ${cls||''}">${html}</span>`;
  if (p.kind==='tx'){ const a = accById(p.accountId);
    return [c(p.type==='income'?'pc-inc':'pc-exp', p.type==='income'?'Έσοδο':'Έξοδο'), c('pc-amt', (p.type==='income'?'+':'−')+fmt(p.amount)),
      c(p.catMatched?'pc-hit':'', `${p.catEmoji} ${esc(p.category)}${p.catMatched?` <i>${p.catOwn?'δική σου κατηγορία':'κατηγορία'} ✓</i>`:''}`),
      p.place?c('', esc(p.place)):'', a?c('', esc(a.name)):'', c('', p.date===today()?'σήμερα':fmtDate(p.date))].join('');
  }
  if (p.kind==='event') return [c('pc-ev','Ατζέντα'), c('pc-hit', esc(p.title)), c('', p.date===today()?'σήμερα':p.date===ymd(dShift(new Date(),1))?'αύριο':fmtDate(p.date)),
    p.start?c('', `${p.start}–${p.end}${toMin(p.end)<toMin(p.start)?' (+1)':''}`):c('', 'όλη μέρα'), p.repeat!=='none'?c('', REPEATS[p.repeat]):'', p.note?c('', '📝 '+esc(p.note)):''].join('');
  if (p.kind==='loan'){ const a = accById(p.accountId); return [c('pc-loan','Δανεικά'), c('pc-amt', '−'+fmt(p.amount)), c('pc-hit', '🤝 '+esc(p.person)), a?c('', esc(a.name)):'', c('', p.date===today()?'σήμερα':fmtDate(p.date)), c('pc-loan', `σύνολο που σου χρωστάνε: +${fmt(loansTotal()+p.amount)}`)].join(''); }
  if (p.kind==='repay'){ const a = accById(p.accountId); return [c('pc-loan','Επιστροφή δανεικών'), c('pc-amt pc-inc', '+'+fmt(p.amount)), c('pc-hit', '🤝 '+esc(p.person)+` <i>χρωστούσε ${fmt(p.owed)}</i>`), a?c('', esc(a.name)):'', p.amount<p.owed?c('', `μένουν ${fmt(p.owed-p.amount)}`):c('', 'εξοφλείται ✓')].join(''); }
  if (p.kind==='ask') return c('pc-ev','Ερώτηση') + c('', 'πάτα Enter για απάντηση');
  return `<span class="pc pc-warn">${esc(p.why)}</span>`;
}

      const id = uid(); S.tx.push({id, created:Date.now(), type:p.type, amount:p.amount, accountId:p.accountId, toAccountId:'', place:p.place, category:p.category, emoji:'', date:p.date, note:''});

      const a = accById(p.accountId);
      AI.log.push({undo:'tx:'+id, html:`✓ ${p.type==='income'?'Έσοδο':'Έξοδο'} <b>${p.type==='income'?'+':'−'}${fmt(p.amount)}</b> · ${p.catEmoji} ${esc(p.category)}${p.place?' · '+esc(p.place):''}<br><small class="faint">${esc(a.name)}: ${fmt(balance(a.id))} · ${p.date===today()?'σήμερα':fmtDate(p.date)}</small>`});
    }
    if (p.kind==='loan'){
      const id = uid(); S.tx.push({id, created:Date.now(), type:'expense', loan:true, amount:p.amount, accountId:p.accountId, toAccountId:'', place:p.person, category:'Δανεικά', emoji:'', date:p.date, note:''});
      flashId = id; save();
      AI.log.push({undo:'tx:'+id, html:`✓ Δανεικά σε <b>${esc(p.person)}</b>: <b style="color:var(--loan)">${fmt(p.amount)}</b><br><small class="faint">${esc(accById(p.accountId)?.name||'')}: ${fmt(balance(p.accountId))} · σου χρωστάνε συνολικά <b style="color:var(--loan)">+${fmt(loansTotal())}</b></small>`});
    }
    if (p.kind==='repay'){
      let left = p.amount; const ids = [];
      for (const lid of p.loans){ if (left<=0) break; const l = S.tx.find(x=>x.id===lid); if (!l) continue; const part = Math.min(left, loanLeft(l)); if (part<=0) continue; ids.push(repayLoan(l, part, p.accountId, p.date)); left = Math.round((left-part)*100)/100; }
      const still = Math.round(S.tx.filter(x=>p.loans.includes(x.id)).reduce((s,l)=>s+loanLeft(l),0)*100)/100;
      AI.log.push({undo:'txs:'+ids.join(','), html:`✓ Επιστροφή από <b>${esc(p.person)}</b>: <b>+${fmt(p.amount)}</b><br><small class="faint">${still>0?`χρωστάει ακόμα ${fmt(still)}`:'εξοφλήθηκε ✓'} · σύνολο δανεικών +${fmt(loansTotal())}</small>`});
    }
    if (p.kind==='event'){
      const id = uid(); S.events.push({id, created:Date.now(), done:false, doneDates:[], title:p.title, date:p.date, start:p.start, end:p.end, color:EV_COLORS[S.events.length%EV_COLORS.length], repeat:p.repeat, note:p.note||''});
      save();
      AI.log.push({undo:'ev:'+id, html:`✓ Στην ατζέντα: <b>${esc(p.title)}</b>${p.note?`<br>📝 ${esc(p.note)}`:''}<br><small class="faint">${p.date===today()?'Σήμερα':fmtDate(p.date)}${p.start?` · ${p.start}–${p.end}`:' · όλη μέρα'}${p.repeat!=='none'?' · '+REPEATS[p.repeat]:''}</small>`});
    }
  }
  inp.value = ''; aiGrow(); aiPreview(); aiSaveLog(); aiPaint(); render();
}

  const gl = e.target.closest && e.target.closest('.glass');

    const k = Math.max(2, 7 - r.width/120);
    t.style.transform = `perspective(1000px) rotateX(${(-y*k).toFixed(2)}deg) rotateY(${(x*k).toFixed(2)}deg) translateY(-3px)`; }
}, {passive:true});

/* ============ particles ============ */
(function particles(){
  const c = document.getElementById('fx'), x = c.getContext('2d');
  let W, H, dpr, P = [], mouse = {x:-999,y:-999}, PT='235,255,245', PL='190,255,225';
  function size(){ dpr = Math.min(2, devicePixelRatio||1); W = innerWidth; H = innerHeight; c.width = W*dpr; c.height = H*dpr; c.style.width=W+'px'; c.style.height=H+'px'; x.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(108, W*H/13333));
    P = Array.from({length:n}, ()=>({x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.18, vy:(Math.random()-.5)*.18-.05, r:Math.random()*1.6+.4, a:Math.random()*.5+.2, tw:Math.random()*6.28})); }
  size(); addEventListener('resize', size);
  addEventListener('pointermove', e=>{ mouse.x=e.clientX; mouse.y=e.clientY; }, {passive:true});
  function frame(t){
    x.clearRect(0,0,W,H);
    const th = document.documentElement.dataset.theme; if (frame.k!==th){ frame.k = th; const cs = getComputedStyle(document.documentElement); PT = cs.getPropertyValue('--pt').trim(); PL = cs.getPropertyValue('--pl').trim(); }
    for (const p of P){
      const dx = p.x-mouse.x, dy = p.y-mouse.y, d2 = dx*dx+dy*dy;
      if (d2 < 22000){ const f = (1-d2/22000)*.6; p.x += dx/Math.sqrt(d2+1)*f; p.y += dy/Math.sqrt(d2+1)*f; }
      p.x += p.vx; p.y += p.vy;
      if (p.x<-10) p.x=W+10; if (p.x>W+10) p.x=-10; if (p.y<-10) p.y=H+10; if (p.y>H+10) p.y=-10;
      const a = p.a*(.6+.4*Math.sin(t/900+p.tw));
      x.beginPath(); x.arc(p.x,p.y,p.r,0,6.283); x.fillStyle = `rgba(${PT},${a})`; x.fill();
    }
    x.lineWidth = .6;
    for (let i=0;i<P.length;i++) for (let j=i+1;j<P.length;j++){
      const a = P[i], b = P[j], dx = a.x-b.x, dy = a.y-b.y, d = dx*dx+dy*dy;
      if (d < 11000){ x.strokeStyle = `rgba(${PL},${(1-d/11000)*.12})`; x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke(); }
    }
    if (!RM && !document.hidden) requestAnimationFrame(frame); else if (!RM) document.addEventListener('visibilitychange', ()=>requestAnimationFrame(frame), {once:true});
  }
  requestAnimationFrame(frame);
})();

/* ============ ASCII flow ============ */
let asciiRaf = null;
function startAscii(){
  stopAscii();
  const pre = document.getElementById('asciiPre'); if (!pre) return;
  const chars = ' .·:-=+*%#@';
  let cols = 0, rows = 0, last = 0;
  const measure = ()=>{ const r = pre.getBoundingClientRect(); cols = Math.max(10, Math.floor((r.width-28)/7.3)); rows = Math.max(6, Math.floor((r.height-28)/11.55)); };
  measure();
  const spentRatio = Math.min(2, (monthSum('expense', today().slice(0,7)) / Math.max(1, monthSum('income', today().slice(0,7)) || 1)));
  const speed = .6 + Math.min(1, spentRatio) * .8;
  const draw = (t)=>{
    if (!document.getElementById('asciiPre')) return stopAscii();
    if (t - last > 66){
      last = t; const T = t/1000*speed; let s = '';
      for (let y=0;y<rows;y++){
        for (let x=0;x<cols;x++){
          const v = Math.sin(x*.16 + T) + Math.sin(y*.32 - T*1.3) + Math.sin((x+y)*.09 + T*.7) + Math.cos(Math.hypot(x-cols/2, (y-rows/2)*2)*.18 - T*1.6);
          s += chars[Math.max(0, Math.min(chars.length-1, Math.floor((v+4)/8*chars.length)))];
        }
        s += '\n';
      }
      pre.textContent = s;
    }
    if (!RM) asciiRaf = requestAnimationFrame(draw);
  };
  addEventListener('resize', measure);
  asciiRaf = requestAnimationFrame(draw);
}
function stopAscii(){ if (asciiRaf) cancelAnimationFrame(asciiRaf); asciiRaf = null; }
